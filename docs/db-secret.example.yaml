# Template only, kept outside k8s_manifest/ so Argo CD never applies it.
# Real credentials are never committed (see .gitignore).
#
# Create the Secret before the database starts, for example:
#   kubectl -n jerney create secret generic jerney-db-secret \
#     --from-literal=POSTGRES_USER=jerney_user \
#     --from-literal=POSTGRES_PASSWORD="$(openssl rand -base64 24)" \
#     --from-literal=POSTGRES_DB=jerney_db
#
# In production, sync it from AWS Secrets Manager with the External Secrets
# Operator instead of creating it by hand.
apiVersion: v1
kind: Secret
metadata:
  name: jerney-db-secret
  namespace: jerney
  labels:
    app.kubernetes.io/part-of: jerney
type: Opaque
stringData:
  POSTGRES_USER: jerney_user
  POSTGRES_PASSWORD: CHANGE-ME
  POSTGRES_DB: jerney_db
