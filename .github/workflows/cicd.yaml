name: Jerney DevSecOps Pipeline

# Pull requests run every check without publishing anything.
# Pushes to main also publish the images (only after they pass the scan) and
# bump the image tags in k8s_manifest/, which Argo CD then syncs.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io/muhammad-31
  NODE_VERSION: "22"

# Third-party actions are pinned to full commit SHAs. In March 2026 most
# trivy-action version tags were force-pushed to malicious commits; a tag or
# branch reference (like @master) would have run that code.

jobs:
  # stage 1 - lint both components
  lint:
    name: Lint (${{ matrix.component }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ matrix.component }}/package-lock.json

      - working-directory: ${{ matrix.component }}
        run: npm ci

      - working-directory: ${{ matrix.component }}
        run: npm run lint

  # stage 2 - known vulnerabilities in runtime dependencies block the build
  sca:
    name: Dependency audit (${{ matrix.component }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Production dependencies only: dev tooling (Vite, nodemon) never ships
      # in the images. The full report is printed for visibility.
      - name: npm audit (runtime dependencies, high and critical)
        working-directory: ${{ matrix.component }}
        run: |
          npm audit --audit-level=high || true
          npm audit --omit=dev --audit-level=high

  # stage 3 - infrastructure and manifest misconfigurations
  iac-scan:
    name: IaC scan (Checkov)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Terraform (blocking)
        uses: bridgecrewio/checkov-action@6f26dc90000b74feb589a906cdfae540f5119895 # v12.3134.0
        with:
          directory: terraform/
          framework: terraform
          config_file: .checkov.yaml
          output_format: cli

      - name: Kubernetes manifests (report only, see README)
        uses: bridgecrewio/checkov-action@6f26dc90000b74feb589a906cdfae540f5119895 # v12.3134.0
        with:
          directory: k8s_manifest/
          framework: kubernetes
          soft_fail: true
          output_format: cli

  # stage 4 - Dockerfile best practices
  dockerfile-lint:
    name: Dockerfile lint (${{ matrix.component }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: ${{ matrix.component }}/Dockerfile
          config: .hadolint.yaml

  # stages 5 + 6 - build, scan, and only then push
  build-scan-push:
    name: Build, scan, push (${{ matrix.component }})
    runs-on: ubuntu-24.04
    needs: [lint, sca, iac-scan, dockerfile-lint]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/jerney-${{ matrix.component }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (loaded locally, not pushed yet)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.component }}
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      - name: Scan image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: json
          output: trivy.json
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      # Each finding becomes an annotation on the PR; any fixable CRITICAL/HIGH
      # vulnerability fails the job, so nothing below (the push) runs.
      - name: Enforce scan results (fixable CRITICAL/HIGH fail the build)
        run: |
          python3 - <<'PY'
          import json, sys
          data = json.load(open("trivy.json"))
          found = [(r["Target"], v) for r in data.get("Results", []) for v in (r.get("Vulnerabilities") or [])]
          for target, v in found:
              print(f"::error title={v['VulnerabilityID']} ({v['Severity']})::"
                    f"{v['PkgName']} {v['InstalledVersion']} -> fixed in {v.get('FixedVersion')} [{target}]")
          print(f"{len(found)} fixable CRITICAL/HIGH vulnerabilities")
          sys.exit(1 if found else 0)
          PY

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the scanned image
        if: github.event_name == 'push'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in $TAGS; do
            docker push "$tag"
          done

  # stage 7 - point the manifests at the new images; Argo CD syncs the change
  update-manifest:
    name: Update image tags
    runs-on: ubuntu-24.04
    if: github.event_name == 'push'
    needs: build-scan-push
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set image tags
        run: |
          tag="$(git rev-parse --short=7 HEAD)"
          sed -i "s|image: .*jerney-backend:.*|image: ${REGISTRY}/jerney-backend:${tag}|" k8s_manifest/04-backend/deployment.yaml
          sed -i "s|image: .*jerney-frontend:.*|image: ${REGISTRY}/jerney-frontend:${tag}|" k8s_manifest/05-frontend/deployment.yaml
          git diff --stat

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s_manifest/
          git diff --cached --quiet && exit 0
          git commit -m "Deploy $(git rev-parse --short=7 HEAD) [skip ci]"
          git push
